[package]
name = "sanikey-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
calamine = "=0.36.1"
chrono = "=0.4.45"
dicom-core = "=0.10.0"
dicom-object = "=0.10.0"
dicom-pixeldata = { version = "=0.10.0", default-features = false, features = ["image", "native"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg"] }
indexmap = "2.14.2"
lopdf = { version = "=0.40.0", default-features = false }
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }
regex = "1.13.1"
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde_json = "1.0.154"
sevenz-rust2 = { version = "=0.24.0", default-features = false, features = ["aes256", "bzip2", "ppmd", "util"] }
sha2 = "0.10.9"
tar = { version = "0.4.44", default-features = false }
toml = { version = "1.1.8", features = ["preserve_order"] }
unicode-normalization = "=0.1.25"
xz2 = "0.1.7"
zip = { version = "=8.6.0", default-features = false, features = ["bzip2", "deflate", "lzma"] }

[dev-dependencies]
sevenz-rust2 = { version = "=0.24.0", default-features = false, features = ["compress"] }
